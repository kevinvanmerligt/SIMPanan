name: dompet_harian
description: Aplikasi Pengelola Keuangan Pribadi Offline & Aman.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2

  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  shared_preferences: ^2.2.3

  # Format Rupiah, Tanggal Indonesia, & Grafik 6 Hari Terakhir
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
